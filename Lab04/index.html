<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Tareas</title>
    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <!-- Encabezado -->
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card shadow">
            <div class="card-header bg-primary text-white">
              <h1 class="h3 mb-0">Gestión de Tareas</h1>
            </div>

            <div class="card-body">
              <!-- Formulario -->
              <form id="todo-form" class="mb-4">
                <div class="mb-2">
                  <input
                    type="text"
                    id="todo-input"
                    class="form-control"
                    placeholder="Título de la tarea"
                    autocomplete="off"
                  />
                </div>
                <div class="mb-2">
                  <input
                    type="text"
                    id="curso-input"
                    class="form-control"
                    placeholder="Curso"
                    autocomplete="off"
                  />
                </div>
                <div class="mb-2">
                  <input type="date" id="fecha-input" class="form-control" />
                </div>
                <div id="alert-container"></div>
                <button type="submit" class="btn btn-primary">Agregar</button>
              </form>

              <!-- Lista de tareas -->
              <h2 class="h5 mb-3">Lista de tareas</h2>

              <ul id="todo-list" class="list-group"></ul>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- JavaScript de la aplicación -->
    <script src="app.js"></script>
  </body>
</html>
<!-- para una mejor visualizacion del codigo, estoy usando una extencion(Prettier) -->
