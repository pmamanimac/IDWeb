<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Módulo de Registro para el Sistema de Gestión Académica</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <form action="/procesar" method="POST" class="form-container">
      <h2>Módulo de Registro para el Sistema de Gestión Académica</h2>
      <fieldset>
        <legend>Información Personal</legend>
        <div class="personalinfo">          
          <label for="fathername">Apellido Paterno</label><br>
          <input type="text" id="fathername" name="fathername" class="form-input" required/><br>
          <label for="mothername">Apellido Materno</label><br>
          <input type="text" id="mothername" name="mothername" class="form-input" required/><br>
          <label for="firstname">Nombres</label><br>
          <input type="text" id="firstname" name="firstname" class="form-input" required/><br>
          <label for="birthdate">Fecha de Nacimiento</label><br>
          <input type="date" id="birthdate" name="birthdate" max="2016-12-31" min="1850-01-01"/><br>
        </div>
      </fieldset>
      <fieldset>
        <legend>Información de la Cuenta</legend>
        <div class="accountinfo">
          <label for="email">Correo Institucional:</label>
          <input type="email" id="email" name="email" class="form-input" required placeholder="usuario@unsa.edu.pe"><br>
          <label for="">Constraseña</label>
          <input type="password" id="password" name="password" class="form-input" required pattern="(?=.*\d)(?=.*[A-Z]).{8,}">
        </div>
      </fieldset>
      <fieldset>
        <legend>Aspectos Académicos</legend>
        <div class="academicblock">
          <label for="nstudent">Código de estudiante:</label>
          <input type="number" id="nstudent" name="nstudent" class="form-input" required placeholder="20260203" pattern="[0-9]{8}"><br>
          <label for="career">Carrera Profesional</label>
          <select id="career" name="career">
            <option value=""> -- Elija su Escuela/Programa -- </option>
            <option value="4010">1. INGENIERÍA AGRONÓMICA </option>
            <option value="4020">2. BIOLOGÍA </option>
            <option value="4030">3. CIENCIAS DE LA NUTRICIÓN </option>
            <option value="4040">4. INGENIERÍA PESQUERA </option>
            <option value="4050">5. ENFERMERÍA </option>
            <option value="4060">6. MEDICINA </option>
            <option value="4310">7. ARQUITECTURA </option>
            <option value="4320">8. FÍSICA </option>
            <option value="4330">9. MATEMÁTICAS </option>
            <option value="4340">10. QUÍMICA </option>
            <!-- ...............................  -->
            <!-- codigo prestado de la pagina oficial UNSA-->
          </select><br>
          <div class="shift">
            <input type="radio" id="morningshift" name="shift" value="morningshift">
            <label for="morningshift">Mañana</label>
            <input type="radio" id="afternoonshift" name="shift" value="afternoonshift">
            <label for="afternoonshift">Tarde</label>
          </div><br>
          <input type="checkbox" id="terminos" name="terminos" required>
          <label for="terminos">Acepto los términos y condiciones</label>
        </div>
      </fieldset><br>
      <div>
        <label for="comment">Comentarios</label><br>
        <textarea name="comment" id="comment"></textarea>
      </div>
      <button type="submit" class="btn">Registrar Datos</button>
    </form>
  </body>
</html>
