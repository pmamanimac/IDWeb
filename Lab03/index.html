<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema Web de Gestión Académica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg encabezado-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#inicio">Sistema</a>
            <!-- hamburger button para móviles -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                    data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                    aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="#inicio">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#cursos">Cursos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#noticias">Noticias</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contacto">Contacto</a></li>
                </ul>

                <div class="d-flex flex-column flex-lg-row gap-2">
                    <button class="btn btn-outline-light" type="button">Iniciar sesion</button>
                    <button class="btn sis-btn-dorado" type="button">Registrarse</button>
                </div>
            </div>
        </div>
    </nav>

    <header id="inicio" class="hero">
    <div class="hero-texto">
      <p class="hero-kicker">Universidad Nacional</p>
      <h1>Prepárate para el futuro</h1>
      <p class="hero-descripcion">
        Matricúlate, revisa tus notas y consulta tu horario desde cualquier
        dispositivo.
      </p>
      <div class="hero-acciones">
        <button class="btn btn-lg sis-btn-dorado" type="button">Explorar cursos</button>
        <button class="btn btn-lg btn-outline-secondary" type="button">Cómo funciona</button>
      </div>
    </div>
 
    <div class="hero-imagen">
      <img src="img/graduate-group.png" alt="graduate-group">
    </div>
  </header>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
